services:
  - type: web
    name: medidoc-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.1
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:5175
      - key: DJANGO_SECRET_KEY
        sync: false

  - type: web
    name: medidoc-ai-chatbot
    runtime: python
    rootDir: chatbot
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.1
      - key: CHATBOT_DEBUG
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
